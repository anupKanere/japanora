name: Build Android APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies & Build Bundle
        run: |
          cd mobile
          npm install --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Build Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Japanora-v1.0.0-debug.apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
